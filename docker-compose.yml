version: '3.8'

services:
  jules-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jules-agent
    ports:
      - "8000:8000"
    environment:
      - WORKSPACE_ROOT=/app
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - .:/app
    restart: unless-stopped
